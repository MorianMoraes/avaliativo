<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5c99">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>
    <div class="container">
        <div class="card">
            <form id="formConsulta">
                <label for="cep">CEP</label>
                <input id="cep" type="text" inputmode="numeric" maxlength="9" placeholder="01001-000" required>
                <label for="cidade">Cidade</label>
                <input id="cidade" type="text" placeholder="São Paulo" required>
                <button type="submit">Consultar Endereço</button>
            </form>
            <p id="mensagem" role="status" aria-live="polite"></p>
            <script src="index.js"></script>
    </div>
    </div>
</body>


</html>
